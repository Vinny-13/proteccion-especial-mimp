name: Infraestructura - Terraform

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    name: Crear PostgreSQL Flexible Server
    runs-on: ubuntu-latest
    env:
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-mimp-proteccion' }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION || 'eastus' }}
      TF_VAR_server_name: ${{ vars.AZURE_DB_SERVER_NAME }}
      TF_VAR_database_name: ${{ vars.DB_NAME || 'mimp_proteccion' }}
      TF_VAR_db_admin_username: ${{ vars.DB_ADMIN_USERNAME || 'mimpadmin' }}
      TF_VAR_db_admin_password: ${{ secrets.DB_ADMIN_PASSWORD }}
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP || vars.AZURE_RESOURCE_GROUP || 'rg-mimp-proteccion' }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER || 'terraform-state' }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'mimp-proteccion.tfstate' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Obtener IP pública temporal del runner
        shell: bash
        run: echo "RUNNER_IP=$(curl --fail --silent https://api.ipify.org)" >> "$GITHUB_ENV"

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Formatear Terraform
        run: terraform fmt -check -recursive infra

      - name: Preparar almacenamiento del estado Terraform
        shell: bash
        run: |
          test -n "$TF_STATE_STORAGE_ACCOUNT" || {
            echo "Falta la variable TF_STATE_STORAGE_ACCOUNT (3-24 minúsculas y números).";
            exit 1;
          }
          az group create \
            --name "$TF_STATE_RESOURCE_GROUP" \
            --location "${TF_VAR_location}" \
            --output none
          az storage account create \
            --name "$TF_STATE_STORAGE_ACCOUNT" \
            --resource-group "$TF_STATE_RESOURCE_GROUP" \
            --location "${TF_VAR_location}" \
            --sku Standard_LRS \
            --kind StorageV2 \
            --https-only true \
            --min-tls-version TLS1_2 \
            --allow-blob-public-access false \
            --output none
          state_key=$(az storage account keys list \
            --account-name "$TF_STATE_STORAGE_ACCOUNT" \
            --resource-group "$TF_STATE_RESOURCE_GROUP" \
            --query '[0].value' --output tsv)
          az storage container create \
            --account-name "$TF_STATE_STORAGE_ACCOUNT" \
            --account-key "$state_key" \
            --name "$TF_STATE_CONTAINER" \
            --output none
          echo "ARM_ACCESS_KEY=$state_key" >> "$GITHUB_ENV"

      - name: Inicializar Terraform
        run: |
          terraform -chdir=infra init -input=false -reconfigure \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${TF_STATE_KEY}"

      - name: Validar Terraform
        run: terraform -chdir=infra validate

      - name: Planificar infraestructura
        run: terraform -chdir=infra plan -input=false -out=tfplan -var="github_actions_ip=${RUNNER_IP}"

      - name: Aplicar infraestructura
        run: terraform -chdir=infra apply -input=false -auto-approve tfplan

      - name: Publicar resumen
        run: |
          echo "## PostgreSQL creado" >> "$GITHUB_STEP_SUMMARY"
          echo "- FQDN: $(terraform -chdir=infra output -raw server_fqdn)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base de datos: $(terraform -chdir=infra output -raw database_name)" >> "$GITHUB_STEP_SUMMARY"
